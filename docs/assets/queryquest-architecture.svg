<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
<title id="title">QueryQuest: GPT and AWS research architectures</title>
<desc id="desc">A question flows through planning, search, and writing to a report with source links. The GPT version uses the OpenAI Agents SDK and WebSearchTool. The AWS version uses Claude on Bedrock and direct AgentCore Web Search calls through Boto3. AWS hosting uses CloudFront, Nginx and Gradio in Docker on EC2, with an IAM role.</desc>
<defs>
 <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#274563" flood-opacity=".07"/></filter>
 <symbol id="plan" viewBox="0 0 32 32"><rect x="6" y="5" width="21" height="24" rx="4"/><path d="M11 3v5m11-5v5M11 14h11m-11 6h11m-11 5h6"/></symbol>
 <symbol id="search" viewBox="0 0 32 32"><circle cx="14" cy="14" r="9"/><path d="m21 21 8 8M10 14h8m-4-4v8"/></symbol>
 <symbol id="write" viewBox="0 0 32 32"><path d="M19 7H8a3 3 0 0 0-3 3v16a3 3 0 0 0 3 3h16a3 3 0 0 0 3-3V15M14 19l2-7L26 2l5 5-10 10-7 2Zm8-13 5 5M10 24h11"/></symbol>
 <symbol id="spark" viewBox="0 0 32 32"><path d="m16 3 3.5 9.5L29 16l-9.5 3.5L16 29l-3.5-9.5L3 16l9.5-3.5L16 3Z"/></symbol>
 <symbol id="cloud" viewBox="0 0 32 32"><path d="M8 25a6 6 0 0 1-1-12 9 9 0 0 1 17-3 7.5 7.5 0 0 1 1 15H8Z"/><path d="m12 18 4-4 4 4m-4-4v15"/></symbol>
 <symbol id="report" viewBox="0 0 32 32"><path d="M8 3h12l6 6v20H8V3Zm12 0v7h6M12 16h10m-10 5h10m-10 4h6"/></symbol>

 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbfcff"/><stop offset="1" stop-color="#eef3fa"/></linearGradient>
 <linearGradient id="gpt" x2="0" y2="1"><stop stop-color="#e9f8f1"/><stop offset="1" stop-color="#f6fcf9"/></linearGradient>
 <linearGradient id="aws" x2="0" y2="1"><stop stop-color="#fff0df"/><stop offset="1" stop-color="#fffaf4"/></linearGradient>
 <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#147c68" stroke-width="1.6"/></marker>
 <marker id="orangeArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#ae5e14" stroke-width="1.6"/></marker>
 <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#5272be" stroke-width="1.6"/></marker>
 <style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#1f3048}.muted{fill:#53667e}.mint{fill:#147c68}.orange{fill:#ae5e14}.coral{fill:#df655b}.micro{font-size:21px;letter-spacing:3px;font-weight:700}.label{font-size:30px;font-weight:700}.body{font-size:25px}.small{font-size:23px}.node{fill:#ffffff;stroke:#d4e0e8;stroke-width:1.5}.wire{fill:none;stroke-width:2.5}</style>
</defs>
<rect width="1600" height="1600" fill="url(#bg)"/>
<circle cx="1460" cy="40" r="280" fill="#df655b" opacity=".07"/>
<path d="M80 112H1520" stroke="#cfd9e6"/>
<rect x="80" y="50" width="40" height="40" rx="12" fill="#df655b"/>
<path d="M90 70h20m-10-10v20" stroke="#ffffff" stroke-width="3"/>
<text x="137" y="82" font-size="32" font-weight="800">Query<tspan class="coral">Quest</tspan></text>
<text x="1520" y="78" text-anchor="end" class="micro muted">ARCHITECTURE / 01</text>
<text x="80" y="207" font-size="76" font-weight="750" letter-spacing="-3">One question. <tspan class="coral">Two AI engines.</tspan></text>
<text x="80" y="263" font-size="30" class="muted">Plan the research. Search for evidence. Write a report with sources.</text>

<!-- OpenAI: three model-backed agents coordinated by Python. -->
<rect filter="url(#shadow)" x="80" y="315" width="704" height="898" rx="28" fill="url(#gpt)" stroke="#c5e4d9"/>
<circle cx="728" cy="357" r="27" fill="#d7efe4"/><use href="#spark" x="712" y="341" width="32" height="32" fill="none" stroke="#147c68" stroke-width="1.8"/>
<text x="116" y="366" class="micro mint">OPENAI / DIRECT API</text>
<text x="116" y="421" font-size="44" font-weight="750">GPT + OpenAI web search</text>
<text x="116" y="464" class="body muted">Gradio interface · OpenAI Agents SDK</text>
<path d="M116 490H748" stroke="#c5e4d9"/>
<rect x="116" y="514" width="632" height="57" rx="12" fill="#f7fffb" stroke="#9ac8b8" stroke-dasharray="6 5"/>
<text x="432" y="552" text-anchor="middle" class="body">Your research question</text>
<path d="M432 572V604" class="wire" stroke="#147c68" marker-end="url(#greenArrow)"/>
<rect x="116" y="617" width="632" height="124" rx="17" class="node"/>
<rect x="137" y="642" width="48" height="48" rx="12" fill="#dcf2e8"/>
<use href="#plan" x="147" y="651" width="28" height="28" fill="none" stroke="#147c68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="206" y="661" class="label">01 / Planner agent</text>
<text x="206" y="705" class="body muted">GPT creates the search queries</text>
<path d="M432 742V774" class="wire" stroke="#147c68" marker-end="url(#greenArrow)"/>
<rect x="116" y="787" width="632" height="124" rx="17" class="node"/>
<rect x="137" y="812" width="48" height="48" rx="12" fill="#dcf2e8"/>
<use href="#search" x="147" y="821" width="28" height="28" fill="none" stroke="#147c68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="206" y="831" class="label">02 / Search agent</text>
<text x="206" y="875" class="body muted">GPT + OpenAI WebSearchTool</text>
<path d="M432 912V944" class="wire" stroke="#147c68" marker-end="url(#greenArrow)"/>
<rect x="116" y="957" width="632" height="124" rx="17" class="node"/>
<rect x="137" y="982" width="48" height="48" rx="12" fill="#dcf2e8"/>
<use href="#write" x="147" y="991" width="28" height="28" fill="none" stroke="#147c68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="206" y="1001" class="label">03 / Writer agent</text>
<text x="206" y="1045" class="body muted">GPT writes from the collected evidence</text>
<path d="M432 1082V1114" class="wire" stroke="#147c68" marker-end="url(#greenArrow)"/>
<rect x="116" y="1127" width="632" height="56" rx="12" fill="#dbf2e8" stroke="#9dccb9"/>
<use href="#report" x="140" y="1138" width="32" height="32" fill="none" stroke="#147c68" stroke-width="1.8" stroke-linejoin="round"/>
<text x="432" y="1164" text-anchor="middle" class="body mint">Validated report + source links</text>

<!-- AWS: model calls for planning/writing, direct service calls for search. -->
<rect filter="url(#shadow)" x="816" y="315" width="704" height="898" rx="28" fill="url(#aws)" stroke="#ecd1b3"/>
<circle cx="1464" cy="357" r="27" fill="#ffe2bc"/><use href="#cloud" x="1448" y="341" width="32" height="32" fill="none" stroke="#ae5e14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="852" y="366" class="micro orange">AWS / BEDROCK + AGENTCORE</text>
<text x="852" y="421" font-size="44" font-weight="750">Claude + AWS web search</text>
<text x="852" y="464" class="body muted">Gradio interface · Boto3</text>
<path d="M852 490H1484" stroke="#ecd1b3"/>
<rect x="852" y="514" width="632" height="57" rx="12" fill="#fffcf7" stroke="#d7b88e" stroke-dasharray="6 5"/>
<text x="1168" y="552" text-anchor="middle" class="body">Your research question</text>
