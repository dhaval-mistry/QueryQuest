<rect x="873" y="812" width="48" height="48" rx="12" fill="#ffead2"/>
<use href="#search" x="883" y="821" width="28" height="28" fill="none" stroke="#ae5e14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="942" y="831" class="label">02 / Search service</text>
<text x="942" y="875" class="body muted">AgentCore Web Search · direct API call</text>
<path d="M1168 912V944" class="wire" stroke="#ae5e14" marker-end="url(#orangeArrow)"/>
<rect x="852" y="957" width="632" height="124" rx="17" class="node"/>
<rect x="873" y="982" width="48" height="48" rx="12" fill="#ffead2"/>
<use href="#write" x="883" y="991" width="28" height="28" fill="none" stroke="#ae5e14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="942" y="1001" class="label">03 / Writer agent</text>
<text x="942" y="1045" class="body muted">Claude on Amazon Bedrock</text>
<path d="M1168 1082V1114" class="wire" stroke="#ae5e14" marker-end="url(#orangeArrow)"/>
<rect x="852" y="1127" width="632" height="56" rx="12" fill="#ffecd4" stroke="#ddbb91"/>
<use href="#report" x="876" y="1138" width="32" height="32" fill="none" stroke="#ae5e14" stroke-width="1.8" stroke-linejoin="round"/>
